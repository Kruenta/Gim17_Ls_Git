name: "❓ Вопрос"
description: "Что-то не понятно — спроси здесь"
title: "[Вопрос] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: "Вопрос"
      placeholder: "Например: кнопка Compare & pull request не появилась, что делать?"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: "Где работаешь"
      placeholder: "задание 01, ветка student/spacefox/task-01"
  - type: checkboxes
    id: checked
    attributes:
      label: "Проверь перед вопросом"
      options:
        - label: "Перечитал(а) задание в assignments/"
        - label: "Заглянул(а) в CONTRIBUTING.md"
